; Ignition (Ign_3dfx.exe) ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â remix-comp-proxy configuration (d3d9.dll proxy)
;
; Call chain:
;   Ignition (fixed-point software T&L) -> Glide -> nGlide -> this d3d9.dll -> d3d9_remix.dll -> .trex
;
; nGlide only ever hands Remix screen-space triangles, which Remix skips outright. The
; geometry Remix actually raytraces comes from the ignition_inject module, which taps
; RenderScene (0x0044A910) while vertices are still in object space and supplies
; WORLD / VIEW / PROJECTION separately via SetTransform.

[Remix]
Enabled=1
DLLName=d3d9_remix.dll

[Chain]
PreLoad=
PostLoad=

; Ignition has no D3D9 vertex shaders ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â nothing for the FFP converter to convert.
[FFP]
Enabled=0
AlbedoStage=0

[Skinning]
Enabled=0

; ============================================================
; Ignition-specific
;
; FovScale           Correction on the derived field of view. The projection is
;                    reconstructed from scene->focal_x/focal_y (live: 253 menu, 425 race).
;                    1.0 = use the derived value as-is.
;
; SuppressGameRaster Diagnostic. Drops nGlide's own draw calls so only the injected
;                    geometry reaches the screen. Black screen => our geometry is not
;                    being path traced. Visible white geometry => it was being traced all
;                    along and merely hidden behind the game's fullscreen blit.
;                    Also hides the HUD, since Ignition draws that through Glide too.
; ============================================================
[Ignition]
FovScale=1.0
SuppressGameRaster=1

; SuppressGameBlit  Drops nGlide's single per-frame StretchRect of its offscreen surface
;                   onto the back buffer. That blit would otherwise paint the game's
;                   raster image straight over whatever Remix path traced.
SuppressGameBlit=0

; KeepGameUI  With SuppressGameRaster on, drop only depth-tested nGlide draws (the 3D world
;             we replace) and let depth-less ones through. Ignition draws its HUD without
;             depth, so this keeps the interface while the path traced world shows through.
;             Set to 0 to drop every nGlide draw as before.
KeepGameUI=1

; DumpTextures  One-shot dump of the first few raw texture pages plus the remap table
;               into rtx_comp/texdump, for offline analysis of the pixel encoding.
DumpTextures=0

; SmoothNormals       Ignition stores no vertex normals, so flat face normals are the
;                     default and terrain reads as faceted. This averages the area
;                     weighted face normals across faces sharing a mesh vertex.
; SmoothAngleDegrees  Crease threshold. Faces disagreeing with the shared normal by more
;                     than this keep their flat normal, so hard edges stay hard.
; RenderRateMultiplier  The game only draws once per 36 Hz logic tick. This lowers that
;                       gate so it draws more often: 2 = up to 72 fps, 3 = 108. Game speed
;                       is unaffected because the frame delta shrinks to match. The 36 Hz
;                       logic subsystem keeps its own pace either way. 1 = untouched.
RenderRateMultiplier=2

SmoothNormals=1
SmoothAngleDegrees=60

[Diagnostics]
Enabled=1
AutoCapture=0
